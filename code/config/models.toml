# ---------------------------------------------------------------------------
# Backup / fallback models (USER REQUEST, 2026-09-12). Separate from the
# primary bake-off candidates above and does NOT change the primary
# selection. These are frontier-class, more-expensive models to fall back to
# ONLY when the primary model's output fails validation/reconciliation
# (PLAN.md §2.10 invariants / §2.3 reconciliation), or the primary is marked
# `unavailable` by the circuit breaker (repeated call failures) — never used
# as a first choice, and never silently swapped in without that trigger.
# Bake-off evidence for these (N=3 on the same gold subset) lives in
# docs/bakeoff.md's "Backup models" section. The user decides whether/which
# to wire in; ml-engineer does not pick.
#
# All three are live on the HF Inference Providers router — same HF_TOKEN,
# no separate API key env var needed. A true out-of-catalog frontier model
# (e.g. a proprietary API like GPT-5/Claude/Gemini, not on HF's router at
# all) would need its own API key env var (OPENAI_API_KEY / ANTHROPIC_API_KEY
# / GOOGLE_API_KEY) AND a second client implementation beyond hf.rs's
# HF-router-only design (PLAN.md §2.11's single `HF_TOKEN` assumption) — a
# real architecture change, not a models.toml addition, so not implemented.
# ---------------------------------------------------------------------------

[fallback]
trigger = "primary output fails validation/reconciliation (engine/verifier), or primary is marked unavailable by the bake-off/production circuit breaker (repeated call failures) — never a routine first choice"
non_hf_provider_note = "None of the three candidates below need a separate API key: all are live on the HF router under the existing HF_TOKEN. A non-HF frontier model (proprietary API) would need its own key env var and a second client, out of scope for this change."

