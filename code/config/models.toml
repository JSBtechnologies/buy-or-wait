# ---------------------------------------------------------------------------
# Per-event-class VLM reader routing (extraction 32c17d5, board decision
# decision.vlm_setup / decision.tiebreak_distinct). Written EXPLICITLY here
# rather than relying on extract/model_config.rs's Rust `Default` — the user
# wants routing tunable in shipped config, and the verifier's gate validates
# against this table, not the Rust fallback. Mirrors that Default exactly;
# posted on bus topic `extract` for extraction/verifier to confirm.
#
# A linked event classifies by event_type/status/category (never the
# model's own free-text doc_type — analyst audit #184/#194 found doc_type
# unreliable, the event row is not) into one of the classes below, in
# order, first match wins; `default_class` is used when nothing matches.
# Each class names exactly 2 readers by role ("vlm_primary" |
# "vlm_escalation" | "vlm_fallback", resolved against `[selected]` above).
# `max_dim_px`/`max_tokens` per reader come from ml-engineer's bake-off
# (PLAN.md §2.11: a different px changes the cache key, silently forcing a
# new paid call instead of a cache hit; max_tokens=1500 vs the ~400 decoding
# default is the fix for Kimi-K3 as a thinking model, PLAN.md §3 -- see
# docs/bakeoff.md "Backup models" for the probe evidence).
#
# `pending_bill_due_date` excludes gemma-4-31B-it as escalation reader:
# analyst's pre-audit (board:verify.image_agree_preaudit) found it drops
# due-date fields on that document shape 4/4, silently falling back to the
# pre-cutoff amount even when the correct, later, larger figure applies
# (image_05) -- so that class routes to vlm_fallback instead. Board decision
# .vlm_routing_v2: Kimi-K3 OUT (failed the backup gate), claude-opus-5 IN
# (role resolves via [selected].vlm_fallback above, updated to match).
# claude-opus-5's max_tokens=4000 follows the lead's spec (adaptive thinking
# is on by default on Opus 5 and counts toward output, same class of problem
# as Kimi-K3's reasoning-token truncation); max_dim_px=1024 is a default
# match to vlm_primary, not yet screened for claude-opus-5 specifically --
# a known gap, same as Kimi-K3's was.
# ---------------------------------------------------------------------------

[vlm_routing]
default_class = "settled_expense_receipt"
# Verifier #250: top-level reconciliation tolerance, must be <= 1.0 (mirrors
# extract/images.rs's `const TOL: f64 = 0.01` for subtotal+tax=total etc.).
# Value/key name not yet confirmed with extraction -- flagged on bus topic
# extract for their read-side to pick this up (or say it's already an
# internal constant and this key is unused).
reconciliation_tolerance = 0.01

