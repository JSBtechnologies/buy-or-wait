# code/config/models.toml
# Owner: ml-engineer. Bake-off candidate roster + decoding/caching config for the
# Hugging Face Inference Providers router (https://router.huggingface.co/v1).
#
# This file lists CANDIDATES ONLY. No model here is the final choice: the
# bake-off (docs/bakeoff.md) produces the evidence, and the user makes the
# final VLM + LLM pick (PLAN.md Phase 2d). ml-engineer does not decide.
#
# No secrets: the HF token is read at runtime from the HF_TOKEN env var only.
# `provider` here is the router's provider slug (`novita`, `deepinfra`, ...),
# not an org/repo name, and is billed per Inference Providers pricing, not the
# model owner's own price list.
# Confirmed live against GET https://router.huggingface.co/v1/models on
# 2026-09-12 (see docs/bakeoff.md for the full provider/pricing dump per
# candidate, including fallback providers for each model).

[router]
base_url = "https://router.huggingface.co/v1"
chat_completions_path = "/chat/completions"
models_list_path = "/models"
token_env = "HF_TOKEN"          # never logged, printed, or committed
protocol = "openai-compatible"

[decoding]
temperature = 0.0
seed = 42
top_p = 1.0
# Tight ceilings per PLAN.md §3 (token efficiency lever). The VLM only fills a
# small typed figure schema; the LLM only emits typed records or the 4-field
# request struct. Neither ever writes decision_explanation (deterministic
# template, 0 tokens) or free prose.
max_tokens_vlm = 400
max_tokens_llm = 300
response_format = "json_object" # constrained via supports_structured_output where available

[retry]
max_attempts = 5
retry_on_status = [429, 500, 502, 503, 504]
backoff_base_ms = 500
backoff_multiplier = 2.0
backoff_max_ms = 8000

[cache]
# key = sha256(content_hash + model_id + model_revision + prompt_version) -- PLAN.md §2.11
key_formula = "sha256(content_hash + model_id + model_revision + prompt_version)"
content_hash_of = "input text bytes, or raw image bytes after downscaling (so resolution sweep produces distinct cache entries)"
model_revision_source = "pinned HF Hub commit sha, fetched from GET https://huggingface.co/api/models/{id} (see model_revision per candidate below)"
prompt_version_source = "version string embedded in each file under code/prompts/ (owned by extraction); a prompt edit invalidates only its own entries"
disk_cache_dir = "store/model_cache"  # under integrator's store/ (§2.11); coordinate via bus topic `blocker` if the integrator's store/ layout differs
system_prompt_prefix_stable = true
# The system-prompt prefix (task framing + output schema) must be byte-identical
# across all calls to the same model so HF providers can apply prefix/prompt
# caching. Only the per-call user content (message text / image ref / user-
# specific facts) varies after the fixed prefix. Prompt files enforce this by
# construction: the versioned prefix block is never templated with per-call
# data.

[image_preprocessing]
# Bake-off sweeps these; ship the smallest that keeps gold accuracy (PLAN.md §3).
candidate_max_dimensions_px = [512, 768, 1024, 1536]
format = "png"
encoding = "base64_data_url"   # data:image/png;base64,...

