#
# NOT MERGE-ANNOUNCED YET: committed on ml-engineer's branch only. Setting
# `[selected]` activates live model calls (extract/model_config.rs resolves
# these into real HfClient calls the moment this file is merged/read by the
# pipeline) — hold the bus "done" announcement until extraction's
# `vlm_mode = "agreement"` handling lands. Today's extract/model_config.rs
# only implements primary -> escalation-on-reconciliation-failure ->
# fallback-on-error; it has no cross-model agreement/voting code path yet
# and does not even parse a `vlm_mode` key (present here as a forward
# declaration, currently inert/ignored by extraction's Selected struct).
#
# KNOWN SCHEMA GAP: vlm_primary and vlm_escalation were bake-off-screened at
# DIFFERENT resolutions (1024px and 768px respectively — see docs/bakeoff.md),
# but extract/model_config.rs's `Selected` only has one global
# `image_max_dim_px`, not a per-role value. Set below to vlm_primary's
# resolution (1024px); vlm_escalation would run at 1024px too until
# extraction adds a per-role field, not its own screened 768px. Flagging
# for extraction, not deciding this myself.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# PENDING ACTIVATION (work item 1, image_accuracy_plan.md: integrator adds
# `[selected]` for real; `main.rs` also still needs its resolve_blank_amount
# call fixed and prompt v3 loaded first, image_accuracy_plan.md context).
# `[selected]` stays deliberately ABSENT here so a stray `cargo run` by any
# other agent never fires live model calls through main.rs's still-unfixed
# call site. ml-engineer's own Phase A N=5 harness (`bin/bakeoff.rs`) proves
# the OCR path against a LOCAL copy of this file with `[selected]` injected,
# never against this committed one -- see docs/bakeoff.md for that run.
#
# HF-only, no vlm_fallback (RULES.md S8: the Anthropic org cap blocks
# claude-opus-5 until 2026-10-01 -- a final user ruling, so it is dropped
# from `[selected]` entirely here rather than left in as an inert fallback
# slot). `extract::images::resolve_blank_amount_agreement` (image_accuracy_
# plan.md §2 witness gate) no longer calls a third/tiebreak model at all: it
# reads `vlm_primary`@1024px and `vlm_escalation`@768px, and only escalates
# resolution (`vlm_primary`@1536px, `vlm_escalation`@1024px) on a failed
# gate -- never a different model. Values to activate, unchanged since
# `decision.vlm_setup`:
#
#   [selected]
#   vlm_primary = "Qwen/Qwen3-VL-235B-A22B-Instruct"    # deepinfra, screened @ 1024px
#   vlm_escalation = "google/gemma-4-31B-it"            # deepinfra, screened @ 768px
#   vlm_mode = "agreement"                              # images.rs's Agreement-mode fn IS the witness gate
#   image_max_dim_px = 1024                             # global default; the gate's own per-role resolutions above take precedence
#   llm_primary = "aisingapore/Gemma-SEA-LION-v4-27B-IT" # publicai (board decision.vlm_setup, unchanged)
#
# `[[fallback.candidates]]` (catalog) and `[vlm_routing]` stay live/unchanged
# below -- only the activation switch moved, and vlm_fallback is dropped.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Per-event-class VLM reader routing (extraction 32c17d5, board decision
# decision.vlm_setup / decision.tiebreak_distinct). Written EXPLICITLY here
# rather than relying on extract/model_config.rs's Rust `Default` — the user
# wants routing tunable in shipped config, and the verifier's gate validates
# against this table, not the Rust fallback. Mirrors that Default exactly;
# posted on bus topic `extract` for extraction/verifier to confirm.
#
# A linked event classifies by event_type/status/category (never the
# model's own free-text doc_type — analyst audit #184/#194 found doc_type
# unreliable, the event row is not) into one of the classes below, in
# order, first match wins; `default_class` is used when nothing matches.
# Each class names exactly 2 readers by role ("vlm_primary" |
# "vlm_escalation" | "vlm_fallback", resolved against `[selected]` above).
# `max_dim_px`/`max_tokens` per reader come from ml-engineer's bake-off
# (PLAN.md §2.11: a different px changes the cache key, silently forcing a
# new paid call instead of a cache hit; max_tokens=1500 vs the ~400 decoding
# default is the fix for Kimi-K3 as a thinking model, PLAN.md §3 -- see
# docs/bakeoff.md "Backup models" for the probe evidence).
#
# Per-class tiebreak assignment (board decision.tiebreak_distinct, confirmed
# by the lead): each class gets a DISTINCT second reader rather than reusing
# the same one everywhere. `pending_bill_due_date` -> gemma-4-31B-it: despite
# analyst's pre-audit finding it drops due-date fields on that shape 4/4
# (falling back to the pre-cutoff amount, e.g. image_05's 704.05), the
# selector only accepts a gemma read when it satisfies the due-date cutoff
# rule -- a wrong pre-cutoff read can never be selected, worst case is
# disagreement -> missing, which board decision.accuracy_first explicitly
# prefers over a wrong value. `settled_expense_receipt` (default) ->
# claude-opus-5 (board decision.vlm_routing_v2/claude_backup: Kimi-K3 OUT,
# failed the backup gate; claude-opus-5 IN). claude-opus-5's max_tokens=4000
# follows the lead's spec (adaptive thinking is on by default on Opus 5 and
# counts toward output); max_dim_px=1024 is a default match to vlm_primary,
# not yet screened for claude-opus-5 specifically -- a known gap.
# ---------------------------------------------------------------------------

# INERT under the Phase A witness gate (image_accuracy_plan.md §2): the table below is the
# OLD per-class-routing + tiebreak design (`extract::model_config::readers_for`/`tiebreak_for`/
# `classify_event`, still compiled and unit-tested in model_config.rs). `extract::images::
# resolve_blank_amount_agreement` no longer calls any of those three functions -- it reads
# `vlm_primary`/`vlm_escalation` from `[selected]` directly with a flat, class-independent
# HF-only read budget (module doc, images.rs). Left in place, unmodified, for
# `evaluation::image_agreement` (verifier's signoff tool, which parses this table itself and is
# not wired into the runtime pipeline) until Phase B's verifier realigns it to the new
# architecture (image_accuracy_plan.md work item 5) -- do not treat this table as describing
# current production routing.
[vlm_routing]
default_class = "settled_expense_receipt"
# Verifier gate #250: cross-model agreement/tiebreak matching tolerance
# (currency units), NOT the reconciliation TOL constant (that stays a
# fixed 0.01 in extract/images.rs). Confirmed key name and semantics from
# extraction's 0248730 (extract/model_config.rs): must be in [0.0, 1.0],
# hard error above that -- board decision.accuracy_first requires 0 false
# accepts, and a looser tolerance would accept more disagreeing reads as
# "agreeing".
tolerance = 0.01

# ROUTING V3 (board decision.vlm_routing_v3, USER DECISION): claude-opus-5
# becomes TIEBREAK-ONLY everywhere -- every class now shares the identical
# shape (readers = Qwen-235B@1024 + gemma@768, tiebreak = claude-opus-5@1024),
# replacing routing v2's per-class reader-pair variation (pending_bill_due_date
# previously paired 235B+claude as primaries). Motivation: the v2 re-read
# (docs/bakeoff.md Step 3a) showed claude-opus-5 is by far the most expensive
# candidate ($0.01764/item vs Qwen's $0.00036 and gemma's $0.00014) and prompt
# v2 alone (unambiguous due_cutoff_date/amount_due_by_cutoff/
# amount_due_after_cutoff schema) already fixed the image_05 root cause for
# every model, including gemma (0/5 -> 5/5 correct) -- claude-opus-5 no longer
# needs to be a routine PRIMARY reader on any class, only the distinct
# tiebreak when Qwen+gemma disagree (decision.tiebreak_distinct still holds:
# tiebreak stays a genuinely different model from both primaries).

[[vlm_routing.classes]]
name = "income_payslip"
event_types = ["income"]
statuses = []
categories = []
readers = [
  { role = "vlm_primary", max_dim_px = 1024, max_tokens = 400 },
  { role = "vlm_escalation", max_dim_px = 768, max_tokens = 400 },
]
tiebreak = { role = "vlm_fallback", max_dim_px = 1024, max_tokens = 4000 }

[[vlm_routing.classes]]
name = "pending_bill_due_date"
event_types = []
statuses = ["pending", "scheduled"]
categories = []
# routing v3: readers = 235B@1024 + gemma@768 (was 235B+claude in v2), tiebreak
# = claude-opus-5@1024 (was gemma in v2). Prompt v2's unambiguous cutoff schema
# means gemma no longer drops the due-date fields on this shape (v1's root
# cause, board finding.image05_root_cause) -- it can be a routine primary
# reader on pending-bill classes again, with claude reserved for tiebreak.
