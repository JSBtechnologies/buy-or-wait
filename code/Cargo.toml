[package]
name = "buyorwait"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "buyorwait"
path = "src/main.rs"

[[bin]]
name = "bakeoff"
path = "src/bin/bakeoff.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
anyhow = "1"
